name: Quality checks

on:
  push:
    branches: ["main", "review/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: pytest tests/ --cov=trader --cov-report=term-missing

  frontend-build:
    name: React typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install frontend dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
