[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-ai-paper-trader"
version = "0.2.0"
description = "Indian Equity AI Paper Trading & Quantitative Research Platform"
authors = [{ name = "Project contributors" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "rich>=13.7.0",
    "joblib>=1.4.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "flake8>=7.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
trader = "trader.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
